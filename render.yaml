# Render Blueprint — https://render.com/docs/blueprint-spec
# The API runs the analysis worker embedded (WORKER_MODE=embedded) so the free plan suffices.
# Database and auth are provided by Supabase; set the secret values in the Render dashboard.
services:
  - type: web
    name: repoatlas-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: WORKER_MODE
        value: embedded
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILES
        value: "1500"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
